name: Package design system preview

on:
  push:
    branches:
      - agent/rebuild-monolith-design-system-reference
    paths:
      - .github/workflows/package-design-system-preview.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="monolith-design-system-changed-files"
          mkdir -p "$ROOT/docs"
          mkdir -p "$ROOT/src/app/(dashboard)/admin/design-system"
          cp AGENTS.md "$ROOT/AGENTS.md"
          cp docs/monolith-design-system-reference.md "$ROOT/docs/monolith-design-system-reference.md"
          cp 'src/app/(dashboard)/admin/design-system/page.tsx' "$ROOT/src/app/(dashboard)/admin/design-system/page.tsx"
          cp 'src/app/(dashboard)/admin/design-system/design-system-client.tsx' "$ROOT/src/app/(dashboard)/admin/design-system/design-system-client.tsx"
          cp 'src/app/(dashboard)/admin/design-system/design-system-reference.css' "$ROOT/src/app/(dashboard)/admin/design-system/design-system-reference.css"
          cp 'src/app/(dashboard)/admin/design-system/design-system-production.css' "$ROOT/src/app/(dashboard)/admin/design-system/design-system-production.css"
          zip -r monolith-design-system-changed-files.zip "$ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: monolith-design-system-changed-files
          path: monolith-design-system-changed-files.zip
          retention-days: 1
