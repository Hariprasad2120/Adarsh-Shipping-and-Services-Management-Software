name: Package design system preview

on:
  push:
    branches:
      - agent/rebuild-monolith-design-system-reference
    paths:
      - .github/workflows/package-design-system-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Build changed-files archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="monolith-design-system-local-preview"
          mkdir -p "$ROOT/docs"
          mkdir -p "$ROOT/src/app/(dashboard)/admin/design-system"

          cp AGENTS.md "$ROOT/AGENTS.md"
          cp docs/monolith-design-system-reference.md "$ROOT/docs/monolith-design-system-reference.md"
          cp 'src/app/(dashboard)/admin/design-system/page.tsx' "$ROOT/src/app/(dashboard)/admin/design-system/page.tsx"
          cp 'src/app/(dashboard)/admin/design-system/design-system-client.tsx' "$ROOT/src/app/(dashboard)/admin/design-system/design-system-client.tsx"
          cp 'src/app/(dashboard)/admin/design-system/design-system-reference.css' "$ROOT/src/app/(dashboard)/admin/design-system/design-system-reference.css"
          cp 'src/app/(dashboard)/admin/design-system/design-system-production.css' "$ROOT/src/app/(dashboard)/admin/design-system/design-system-production.css"

          cat > "$ROOT/README-LOCAL-PREVIEW.md" <<'EOF'
          # Monolith design-system local preview

          This archive contains only the files changed for the canonical `/admin/design-system` rebuild.

          ## Apply locally

          1. Back up or commit your current work.
          2. Extract this archive.
          3. Copy the extracted files into the root of your Monolith repository and allow the matching files to be replaced.
          4. Run the validation commands below from the repository root.

          ```powershell
          $env:NODE_OPTIONS='--max-old-space-size=8192'
          npm install
          npx tsc --noEmit
          npm run lint
          npm run build
          npm run dev
          ```

          Sign in with an administrator account and open `/admin/design-system`.

          ## Included files

          - `AGENTS.md`
          - `docs/monolith-design-system-reference.md`
          - `src/app/(dashboard)/admin/design-system/page.tsx`
          - `src/app/(dashboard)/admin/design-system/design-system-client.tsx`
          - `src/app/(dashboard)/admin/design-system/design-system-reference.css`
          - `src/app/(dashboard)/admin/design-system/design-system-production.css`
          EOF

          zip -r monolith-design-system-local-preview.zip "$ROOT"

      - name: Upload preview archive
        uses: actions/upload-artifact@v4
        with:
          name: monolith-design-system-local-preview
          path: monolith-design-system-local-preview.zip
          retention-days: 1
          if-no-files-found: error
